[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bytellm"
version = "1.0.0"
description = "Production-ready Tokenizer-Free Byte-LLM operating on raw bytes (0-255) with Latent Abstract Reasoning and Native Binary Generation (WASM, ASM, Network, Compressed, MIDI, Raw Audio)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
bytellm = "bytellm.cli:main"

[tool.setuptools]
packages = ["bytellm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
